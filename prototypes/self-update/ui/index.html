<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-update · Agent Log Viewer</title>
  <link rel="stylesheet" href="/ui/app.css">
</head>
<body>
  <main class="page">
    <section class="card header" id="header" aria-label="Versions"><p class="meta">Loading…</p></section>
    <div class="columns">
      <div class="col col-main">
        <section class="card update" id="update" aria-label="Update"></section>
        <section class="card changes" id="changes" aria-label="What changes" hidden></section>
      </div>
      <div class="col col-side">
        <section class="card process" id="web" aria-label="Web"></section>
        <section class="card process tone-warning" id="host" aria-label="Runtime host"></section>
      </div>
    </div>
    <footer class="footer" id="footer"></footer>
  </main>
  <script src="/ui/app.js"></script>
</body>
</html>

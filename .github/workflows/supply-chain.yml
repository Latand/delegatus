name: Supply-chain audit

on:
  schedule:
    - cron: "17 4 * * 1"
  # dependabot-lockfile.yml commits the regenerated bun.lock with the repository
  # GITHUB_TOKEN, and GitHub raises no `synchronize` for that push, so the audit
  # is dispatched against the refreshed branch instead.
  workflow_dispatch:

permissions:
  contents: read

# A branch pushed three times ran three full rounds to completion: 7 percent of
# pull-request runs in the audit window (#1761) finished work for a commit that
# had already been replaced. One round per ref, and the newest wins. This group
# is step 1 of the cut order on #1761.
#
# Nothing that must not be cancelled is in reach of this group. After step 2 none
# of these workflows runs on a push to main or a tag at all, and on `pull_request`
# the ref is `refs/pull/<n>/merge` while a run started by hand carries the branch
# ref, so the two never share a group.
#
# The two required workflows get no group at all, deliberately. They run on
# `pull_request_target` and, for the tracker audit, on issue and review events,
# where `github.ref` is the base branch for every publication alike; any group
# narrow enough to be correct there still lets a comment cancel the required run
# in flight and strand a cancelled check on the head, which blocks the merge.
# They finish in 40 to 90 seconds and have never failed, so there is nothing
# worth saving in cancelling them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Require a lockfile change with dependency changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          # A dispatched run carries no pull request payload, and the rule still
          # has to hold for the branch it names against the protected base.
          if [[ -z "$BASE_SHA" ]]; then
            git fetch --no-tags --force origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            BASE_SHA="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" HEAD)"
            export BASE_SHA
          fi

          bun scripts/supply-chain-check.ts --base "$BASE_SHA" --lockfile-only

      - name: Install production and development dependencies
        run: bun install --frozen-lockfile

      - name: Verify installed braces mitigation
        run: bun test scripts/braces-patch.test.ts

      - name: Verify audit retry behavior
        env:
          HOME: ${{ runner.temp }}/audit-tests/home
          XDG_CONFIG_HOME: ${{ runner.temp }}/audit-tests/config
          LLV_STATE_DIR: ${{ runner.temp }}/audit-tests/state
          LLV_CLAUDE_HOME: ${{ runner.temp }}/audit-tests/claude
          LLV_CODEX_HOME: ${{ runner.temp }}/audit-tests/codex
          TMPDIR: ${{ runner.temp }}/audit-tests/tmp
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$LLV_STATE_DIR" "$LLV_CLAUDE_HOME" "$LLV_CODEX_HOME" "$TMPDIR"
          bun test scripts/audit-with-retry.test.ts

      - name: Audit production and development dependencies
        shell: bash
        run: |
          set -euo pipefail

          bun scripts/supply-chain-check.ts --audit-only

name: Privacy tracker audit

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  # PR-authored YAML can remove this guard. That residual risk is accepted:
  # agents author PRs, workflow edits are reviewed, and pre-push runs the scanner.
  # Stronger enforcement needs an independent workflow_run verifier with its
  # own required App identity configured by the operator in branch protection.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      publication_number:
        description: Issue or pull request number to audit
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  privacy-tracker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted audit implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out candidate as inspection input
        if: github.event.pull_request != null
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install trusted dependencies
        run: bun install --frozen-lockfile

      - name: Refuse mixed privacy repairs
        if: github.event.pull_request != null
        env:
          PRIVACY_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          bun -e '
            const { execFileSync } = require("node:child_process");
            let diff;
            try {
              diff = execFileSync("git", ["diff", "--name-only", "--no-renames", "-z", `${process.env.PRIVACY_GUARD_BASE}...HEAD`], { cwd: "candidate", encoding: "utf8" });
            } catch {
              console.error("::error::Unable to compare the candidate with the pull request base; refusing the privacy workflow.");
              process.exit(1);
            }
            const changed = diff.split("\0").filter(Boolean);
            const privacy = p => [".github/workflows/privacy-publication.yml", ".github/workflows/privacy-tracker-audit.yml", ".github/workflows/dependabot-lockfile.yml", "src/lib/environmentIsolation.ts"].includes(p)
              || p.startsWith("scripts/privacy-") || p.startsWith("scripts/generate-privacy-") || p.startsWith("src/lib/privacy/");
            if (changed.some(privacy) && changed.some(p => !privacy(p))) {
              console.error("::error::Privacy workflow or gate implementation changes must be submitted in a separate PR containing only privacy workflow/gate files. Split unrelated files into another PR.");
              process.exit(1);
            }
          '

      - name: Audit public tracker surfaces
        # The release checks the job on main. A push has no tracker item to read.
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLV_PRIVACY_KNOWN_VALUE_FINGERPRINTS_FILE: scripts/privacy-known-value-fingerprints.json
          PUBLICATION_ISSUE_COMMENT_ID: ${{ github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          PUBLICATION_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.publication_number }}
          PUBLICATION_REPO: ${{ github.repository }}
        run: |
          arguments=(--repo "$PUBLICATION_REPO" --number "$PUBLICATION_NUMBER")
          if [[ -n "$PUBLICATION_ISSUE_COMMENT_ID" ]]; then
            arguments+=(--issue-comment "$PUBLICATION_ISSUE_COMMENT_ID")
          fi
          bun scripts/privacy-github-audit.ts "${arguments[@]}" --report-only

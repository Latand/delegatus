name: Docker image

on:
  # A pull request builds the image only when something the Dockerfile copies,
  # installs from or compiles changes. The build runs next build, whose type
  # check covers every TypeScript file in the checkout (tsconfig.json include),
  # and resolveJsonModule lets any of them import JSON, so those globs sit
  # beside the directory paths. Tailwind scans every non-ignored file under the
  # root for class names, not only src/, and .gitignore decides which files it
  # skips. Tailwind scans text sources across extensions, so every repository
  # path is an input; the broad glob also covers new source formats.
  # Pushes to main and v* tags always build.
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - "**/*"
      - package.json
      - bun.lock
      - bunfig.toml
      - patches/**
      - next.config.ts
      - postcss.config.mjs
      - tsconfig.json
      - src/**
      - public/**
      - bin/**
      - vendor/**
      - scripts/**
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.json"
      - "**/*.html"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/.gitignore"
      - .github/workflows/docker-image.yml
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/latand/delegatus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Latand/delegatus
            org.opencontainers.image.description=Delegatus agent runtime and viewer
            org.opencontainers.image.licenses=MIT
      - name: Build both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: published
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Docker image

on:
  # The scope job checks the complete PR diff before admitting a build.
  # GitHub paths filters only inspect the first 300 files and can hide inputs.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  # A merged PR's closed event has refs/heads/main as its ref. Reconstruct its
  # pull ref so closure cancels the same group as open/synchronize events,
  # including runs started under the previous workflow, and keeps main separate.
  group: docker-image-${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      build: ${{ steps.inputs.outputs.build }}
      platforms: ${{ steps.inputs.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        if: github.event.pull_request.state == 'open' && !startsWith(github.head_ref, 'merge-batch/')
        with:
          fetch-depth: 0
      - name: Check image inputs in the complete PR diff
        if: github.event.pull_request.state == 'open' && !startsWith(github.head_ref, 'merge-batch/')
        id: inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/docker-image-scope.cjs "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - name: Finish closure or merge-batch cancellation without a build
        if: github.event.pull_request.state != 'open' || startsWith(github.head_ref, 'merge-batch/')
        run: echo 'Image verification skipped for a closed PR or merge batch.'
  build:
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.outputs.build == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 360 }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request' || needs.scope.outputs.platforms == 'linux/amd64,linux/arm64'
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/latand/delegatus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=https://github.com/Latand/delegatus
            org.opencontainers.image.description=Delegatus agent runtime and viewer
            org.opencontainers.image.licenses=MIT
      - name: Verify PR image within a hard deadline
        if: github.event_name == 'pull_request'
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          PLATFORMS: ${{ needs.scope.outputs.platforms }}
        run: bash scripts/docker-pr-build.sh "$BUILDER" "$PLATFORMS"
      - name: Publish both architectures
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: published
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    # One PR image build leaves runners for the two required privacy checks.
    # Publication has its own single-build slot, so main/tags bypass PR work.
    # At most two image builds run: one verification and one publication.
    # Keep the existing PR slot name so older queued runs share the same cap.
    # Per-PR workflow cancellation removes superseded/closed runs from this
    # queue; queue:max retains verification for other still-open PRs and tags.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'docker-image-build' || 'docker-image-publish-build' }}
      cancel-in-progress: false
      queue: max

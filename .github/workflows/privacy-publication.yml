name: Privacy publication gate

on:
  push:
    branches: [main]
  # PR-authored YAML can remove this guard. That residual risk is accepted:
  # agents author PRs, workflow edits are reviewed, and pre-push runs the scanner.
  # Stronger enforcement needs an independent workflow_run verifier with its
  # own required App identity configured by the operator in branch protection.
  pull_request:
    types: [opened, synchronize, reopened]
  # dependabot-lockfile.yml commits the regenerated bun.lock with the repository
  # GITHUB_TOKEN, and GitHub raises no `synchronize` for that push, so the gate
  # is dispatched against the refreshed branch instead. A dispatched run inspects
  # `github.sha` — the commit its own check run lands on — so it cannot report a
  # verdict for a revision it did not read.
  workflow_dispatch:
  schedule:
    - cron: "31 2 * * *"

permissions:
  contents: read

jobs:
  privacy-publication:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out trusted privacy implementation
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: trusted
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out candidate as inspection input
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Resolve current protected base
        working-directory: trusted
        env:
          PRIVACY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.repository.default_branch }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          git fetch --no-tags --force origin "+refs/heads/${PRIVACY_BASE_REF}:refs/remotes/origin/${PRIVACY_BASE_REF}"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ ]]
            PRIVACY_BASE_SHA="$(git rev-parse --verify "${PUSH_BEFORE}^{commit}")"
          else
            PRIVACY_BASE_SHA="$(git rev-parse --verify "refs/remotes/origin/${PRIVACY_BASE_REF}^{commit}")"
          fi
          printf 'PRIVACY_BASE_SHA=%s\n' "$PRIVACY_BASE_SHA" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Install trusted dependencies
        working-directory: trusted
        run: bun install --frozen-lockfile

      # A failing default-branch suite must leave a repair PR inspectable. Keep
      # the baseline visible and bounded; trusted inspection below and the
      # candidate's own suite remain mandatory publication gates.
      - name: Refuse mixed privacy repairs
        if: github.event.pull_request != null
        env:
          PRIVACY_GUARD_BASE: ${{ github.event.pull_request.base.sha }}
        working-directory: trusted
        run: |
          bun -e '
            const { execFileSync } = require("node:child_process");
            let diff;
            try {
              diff = execFileSync("git", ["diff", "--name-only", "--no-renames", "-z", `${process.env.PRIVACY_GUARD_BASE}...HEAD`], { cwd: "../candidate", encoding: "utf8" });
            } catch {
              console.error("::error::Unable to compare the candidate with the pull request base; refusing the privacy workflow.");
              process.exit(1);
            }
            const changed = diff.split("\0").filter(Boolean);
            const privacy = p => [".github/workflows/privacy-publication.yml", ".github/workflows/privacy-tracker-audit.yml", ".github/workflows/dependabot-lockfile.yml", "src/lib/environmentIsolation.ts"].includes(p)
              || p.startsWith("scripts/privacy-") || p.startsWith("scripts/generate-privacy-") || p.startsWith("src/lib/privacy/");
            if (changed.some(privacy) && changed.some(p => !privacy(p))) {
              console.error("::error::Privacy workflow or gate implementation changes must be submitted in a separate PR containing only privacy workflow/gate files. Split unrelated files into another PR.");
              process.exit(1);
            }
          '

      - name: Scope candidate privacy self-tests with trusted code
        id: privacy-scope
        # The push scans the landed range. The nightly job retests main.
        if: github.event_name != 'push'
        working-directory: trusted
        run: |
          bun -e '
            const { execFileSync } = require("node:child_process");
            const { readdirSync, appendFileSync } = require("node:fs");
            const { ALWAYS_IN_SCOPE, executedPaths } = require("./scripts/ci-platform-scope.ts");
            const tests = readdirSync("scripts").filter(f => /^privacy-.*\.test\.ts$/.test(f)).map(f => `scripts/${f}`);
            const closure = executedPaths(process.cwd(), [...tests, "test-preload.ts"]);
            const changed = execFileSync("git", ["diff", "--name-only", "--no-renames", "-z", `${process.env.PRIVACY_BASE_SHA}...HEAD`], { cwd: "../candidate", encoding: "utf8" }).split("\0").filter(Boolean);
            const run = changed.some(f => closure.has(f) || ALWAYS_IN_SCOPE.includes(f) || f.startsWith("scripts/privacy-") || f.startsWith("scripts/generate-privacy-") || f.startsWith("src/lib/privacy/") || [".github/workflows/privacy-publication.yml", ".github/workflows/privacy-tracker-audit.yml"].includes(f));
            appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          '

      - name: Verify privacy gate behavior
        id: trusted-tests
        if: steps.privacy-scope.outputs.run == 'true'
        working-directory: trusted
        timeout-minutes: 3
        continue-on-error: true
        run: bun test scripts/privacy-*.test.ts

      - name: Report trusted privacy self-test failure
        if: steps.trusted-tests.outcome == 'failure'
        working-directory: trusted
        run: |
          echo "::warning title=Trusted privacy self-tests::Default-branch privacy self-tests failed or timed out. Publication still requires trusted inspection and passing candidate tests."

      # Commit messages are published the moment the branch is pushed, and the
      # gate is the only thing that reads them before that happens. Scanning
      # only the files left the one surface nobody re-reads unguarded.
      #
      # The commit that lands is not one of them: a squash merge composes a new
      # message and lifts the identities git recorded on the branch commits into
      # `Co-authored-by:` trailers. So the same step reads the merge boundary,
      # here, on the pull request, while the composed commit can still be
      # prevented rather than found afterwards in the public history.
      - name: Scan changed publication surfaces, commit messages and the merge boundary
        env:
          PRIVACY_PUSH_TOKEN: ${{ github.event_name == 'push' && github.token || '' }}
          PRIVACY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LLV_PRIVACY_KNOWN_VALUE_FINGERPRINTS_FILE: ${{ github.workspace }}/trusted/scripts/privacy-known-value-fingerprints.json
        working-directory: trusted
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            bun scripts/privacy-landed-publication.ts
          else
            bun scripts/privacy-publication-gate.ts --repository ../candidate --require-known-values --check-commits --base "$PRIVACY_BASE_SHA"
          fi

      # Candidate code runs last, after trusted inspection.
      # It receives no credentials and cannot alter a later trusted verdict.
      # Main took about 129 s for 736 tests. This PR's run was killed at 130 s after 732 passes and zero failures.
      - name: Verify candidate privacy gate behavior within budget
        if: steps.privacy-scope.outputs.run == 'true'
        working-directory: candidate
        timeout-minutes: 5
        run: |
          ln -sT ../trusted/node_modules node_modules
          timeout --kill-after=5s 240s bun test scripts/privacy-*.test.ts

  nightly-privacy-self-tests:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun test scripts/privacy-*.test.ts

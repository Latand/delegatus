name: Dependabot lockfile refresh

# The default-branch follow-up receives a write token after an unprivileged
# Dependabot privacy run. It never consumes artifacts or executes PR scripts.
# Token pushes raise no synchronize event, so refreshed heads need dispatches.
on:
  workflow_run:
    workflows: [Privacy publication gate]
    types: [completed]

permissions:
  contents: read

# A slow completion for an old head must not cancel the current refresh.
concurrency:
  group: dependabot-lockfile-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  refresh-lockfile:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - name: Validate the triggering run and current pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, appendFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const run = event.workflow_run;
          const repo = process.env.GITHUB_REPOSITORY;
          const api = path => JSON.parse(execFileSync("gh", ["api", `repos/${repo}/${path}`], { encoding: "utf8" }));
          const skip = () => { console.log("No current eligible Dependabot PR for this privacy run; no write."); process.exit(0); };
          if (run.path !== ".github/workflows/privacy-publication.yml"
              || run.event !== "pull_request" || run.conclusion !== "success"
              || run.head_repository?.full_name !== repo
              || !run.head_branch?.startsWith("dependabot/")
              || run.pull_requests?.length !== 1) skip();
          const number = run.pull_requests[0].number;
          if (!Number.isSafeInteger(number) || number <= 0) skip();
          const pr = api(`pulls/${number}`);
          if (pr.state !== "open" || pr.user?.login !== "dependabot[bot]" || pr.user?.type !== "Bot"
              || pr.head?.repo?.full_name !== repo || pr.base?.repo?.full_name !== repo
              || pr.base?.ref !== event.repository.default_branch
              || pr.head?.ref !== run.head_branch || pr.head?.sha !== run.head_sha) skip();
          const branch = api(`branches/${encodeURIComponent(pr.head.ref)}`);
          if (branch.protected !== false || branch.commit?.sha !== run.head_sha) {
            console.error("::error::Dependabot head is protected or has moved; refusing lockfile write.");
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `ready=true\nnumber=${number}\nhead_ref=${pr.head.ref}\nhead_sha=${run.head_sha}\n`);
          NODE

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: steps.source.outputs.ready == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ steps.source.outputs.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.source.outputs.ready == 'true'
        with:
          bun-version: 1.3.3

      - name: Regenerate bun.lock without package scripts
        if: steps.source.outputs.ready == 'true'
        run: bun install --lockfile-only --ignore-scripts

      - name: Report whether bun.lock moved
        if: steps.source.outputs.ready == 'true'
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already resolves the bumped ranges"
            printf 'refreshed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'refreshed=true\n' >> "$GITHUB_OUTPUT"
          fi

      # Re-read authority and identity after dependency resolution. The ordinary
      # push also refuses concurrent non-fast-forward branch moves. No token is saved.
      - name: Commit the refreshed lockfile
        id: pushed
        if: steps.lockfile.outputs.refreshed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
          HEAD_SHA: ${{ steps.source.outputs.head_sha }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$HEAD_REF" --arg sha "$HEAD_SHA" --arg base "$BASE_REF" '
            .state == "open" and .user.login == "dependabot[bot]" and .user.type == "Bot"
            and .head.repo.full_name == $repo and .base.repo.full_name == $repo
            and .base.ref == $base and .head.ref == $branch and .head.sha == $sha
          ' <<< "$pr" >/dev/null; then
            echo "::notice::Dependabot PR changed during resolution; no write."
            exit 0
          fi
          encoded_ref="$(jq -rn --arg ref "$HEAD_REF" '$ref | @uri')"
          branch="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${encoded_ref}")"
          if ! jq -e --arg sha "$HEAD_SHA" '.protected == false and .commit.sha == $sha' <<< "$branch" >/dev/null; then
            echo "::error::Dependabot head is protected or has moved; refusing lockfile write."
            exit 1
          fi
          bot='github-actions[bot]'
          bot_id="$(gh api "users/${bot}" --jq '.id')"
          noreply_host="users.noreply.${GITHUB_SERVER_URL#https://}"
          git add -- bun.lock
          git -c "user.name=${bot}" -c "user.email=${bot_id}+${bot}@${noreply_host}" \
            -c core.hooksPath=/dev/null commit -m 'chore(deps): refresh bun.lock' --only -- bun.lock
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/${HEAD_REF}"
          printf 'published=true\n' >> "$GITHUB_OUTPUT"

      - name: Run the gates on the refreshed head
        if: steps.pushed.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.source.outputs.head_ref }}
          PR_NUMBER: ${{ steps.source.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          refused=()

          dispatch() {
            local workflow="$1"
            shift
            if ! gh workflow run "$workflow" --ref "$HEAD_REF" "$@"; then
              refused+=("$workflow")
            fi
          }

          # Each gate is attempted before the step decides, so one workflow's
          # refusal does not cost the branch the runs the other two would have
          # started, and the error names every gate that is missing one. `gh`
          # has already written its own reason for each refusal to the log.
          dispatch supply-chain.yml
          dispatch privacy-publication.yml
          dispatch privacy-tracker-audit.yml -f "publication_number=${PR_NUMBER}"

          if (( ${#refused[@]} > 0 )); then
            echo "::error::${HEAD_REF} refused a dispatch of ${refused[*]}; its refreshed head carries no run of those gates"
            exit 1
          fi

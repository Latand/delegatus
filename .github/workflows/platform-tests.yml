name: Platform tests

# Nobody working on this repository has a Windows machine, so every claim about
# Windows behaviour has to be something CI can refuse. This workflow is that
# refusal. It follows the precedent set by `macos-identity.yml`, which exists
# for the same reason on the macOS side: a job that fails when the behaviour
# does not hold, not a paragraph saying it was tried.
#
# Linux runs this same explicit file list in the scoped local pre-push gate.
# Windows stays here for its native backend and kernel contracts.
#
# Files are named one by one. A directory sweep is forbidden by AGENTS.md
# because sweeping `src/lib/agent/` or `src/app/api/runtime/` drives host
# lifecycle code against whatever registry the runtime resolves; on a runner
# that state is empty, but the rule is the rule and the list is also what keeps
# these jobs short.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch pushed three times ran three full rounds to completion: 7 percent of
# pull-request runs in the audit window (#1761) finished work for a commit that
# had already been replaced. One round per ref, and the newest wins. This group
# is step 1 of the cut order on #1761.
#
# Nothing that must not be cancelled is in reach of this group. After step 2 none
# of these workflows runs on a push to main or a tag at all, and on `pull_request`
# the ref is `refs/pull/<n>/merge` while a run started by hand carries the branch
# ref, so the two never share a group.
#
# The two required workflows get no group at all, deliberately. They run on
# `pull_request_target` and, for the tracker audit, on issue and review events,
# where `github.ref` is the base branch for every publication alike; any group
# narrow enough to be correct there still lets a comment cancel the required run
# in flight and strand a cancelled check on the head, which blocks the merge.
# They finish in 40 to 90 seconds and have never failed, so there is nothing
# worth saving in cancelling them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Journal startup and large-history handoff under the image interpreter.
  journal-startup:
    name: Journal startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve the image interpreter
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -nE 's/.*npm install -g bun@([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | sort -u)
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.pin.outputs.version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify journal startup and handoff against isolated history
        shell: bash
        env:
          LLV_VIEWER_CONTROL_URL: http://127.0.0.1:1
          HOME: ${{ runner.temp }}/journal-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/journal-config
          LLV_STATE_DIR: ${{ runner.temp }}/journal-state
          TMPDIR: ${{ runner.temp }}/journal-tmp
        run: |
          set -euo pipefail
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$LLV_STATE_DIR" "$TMPDIR"
          files=(
            src/runtime-host/journalStartup.test.ts
            src/runtime-host/runtimeHostStartup.test.ts
            src/runtime-host/runtimeHostSuccession.process.test.ts
            src/app/api/runtime/snapshot/route.test.ts
            src/runtime-host/journal.test.ts
            src/runtime-host/hostRehearsal.test.ts
            src/runtime-host/hostRehearsalRun.test.ts
            src/runtime-host/deploymentProxy.test.ts
          )
          for file in "${files[@]}"; do
            test -f "$file"
            flock /var/tmp/llv-heavy-gate.lock bun test "$file" 2>&1 | tee "$RUNNER_TEMP/journal-test.log"
            grep -q "across 1 file" "$RUNNER_TEMP/journal-test.log"
          done
          flock /var/tmp/llv-heavy-gate.lock bun scripts/verify-runtime-host.ts


  # macOS runs the SQLite Apple ships (3.39.5 on macOS 13, the oldest macOS Bun
  # supports), while Bun on this runner links a much newer one. Every state store
  # runs here on SQLite 3.39.4 built from the official amalgamation, the 3.39
  # release Apple's build follows (src/lib/state/minimumSqlite.fixture.ts).
  minimum-sqlite:
    name: Minimum macOS SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve the image interpreter
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pin=$(sed -nE 's/.*npm install -g bun@([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | sort -u)
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$pin" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.pin.outputs.version }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build SQLite 3.39.4 from the official amalgamation
        shell: bash
        run: |
          set -euo pipefail
          library=$(bun -e 'const { minimumSqliteLibrary } = await import("./src/lib/state/minimumSqlite.fixture.ts"); console.log(minimumSqliteLibrary(process.argv[1]))' "$RUNNER_TEMP/minimum-sqlite")
          test -f "$library"
          printf 'LLV_MINIMUM_SQLITE_LIBRARY=%s\n' "$library" >> "$GITHUB_ENV"
      - name: Run the state stores on it
        shell: bash
        env:
          LLV_VIEWER_CONTROL_URL: http://127.0.0.1:1
        run: |
          set -euo pipefail
          files=(
            src/lib/state/sqliteStateStore.bounded.test.ts
            src/lib/state/sqliteStateStore.lifecycle.test.ts
            src/lib/state/sqliteStateStore.readCache.test.ts
            src/lib/state/stateLeaseRecovery.test.ts
            src/lib/state/hotStateStores.sqlite.test.ts
            src/lib/state/pipelineControllerIndex.owner.test.ts
            src/lib/state/durability.test.ts
            src/lib/agent/sqliteRegistryStore.archivedOwner.test.ts
            src/lib/agent/sqliteRegistryStore.history.test.ts
            src/lib/agent/sqliteRegistryStore.keyedWrites.test.ts
            src/lib/agent/sqliteRegistryStore.readOnlyView.test.ts
            src/lib/agent/sqliteRegistryStore.refresh.test.ts
            src/lib/mcp/server.test.ts
            src/lib/mcp/http.test.ts
            src/lib/runtime/handoffQueueStore.test.ts
            src/lib/runtime/cpuAdmissionBudget.test.ts
            src/lib/runtime/deliveryProgress.test.ts
            src/lib/runtime/deploymentLedger.test.ts
            src/lib/runtime/runtimeImageStore.test.ts
            src/lib/memory/index.test.ts
            src/lib/memory/deliveryLedger.test.ts
            src/lib/pipelines/legacyReviewConversion.test.ts
            src/lib/scanner/conversationSearchProjection.test.ts
            src/lib/activity/ingest.test.ts
            src/lib/activity/pull.test.ts
            src/lib/activity/report.test.ts
            src/lib/activity/tokenIngest.test.ts
            src/lib/activity/tokenReport.test.ts
            src/lib/team/cli.team.test.ts
            src/lib/team/passkeys.test.ts
            src/lib/team/workspaces.test.ts
            src/lib/telegram/bot/outbound.test.ts
            src/lib/telegram/bot/store.test.ts
            src/runtime-host/journal.test.ts
            src/runtime-host/journal.codexCallbacks.test.ts
            src/runtime-host/journal.consumerRetention.test.ts
            src/runtime-host/journal.copilot.test.ts
            src/runtime-host/journal.inject.test.ts
            src/runtime-host/journal.sessionRead.test.ts
            src/runtime-host/journalSessionMetadata.test.ts
            src/runtime-host/nativeQueueJournal.test.ts
          )
          run() {
            local root
            root=$(mktemp -d "$RUNNER_TEMP/minimum-sqlite-XXXXXX")
            mkdir -p "$root/home" "$root/config" "$root/state" "$root/tmp"
            HOME="$root/home" XDG_CONFIG_HOME="$root/config" LLV_STATE_DIR="$root/state" TMPDIR="$root/tmp" bun test --timeout 60000 "$@" 2>&1 | tee "$RUNNER_TEMP/minimum-sqlite.log"
            grep -q "across 1 file" "$RUNNER_TEMP/minimum-sqlite.log"
          }
          run src/lib/state/minimumSqliteSchema.test.ts
          run src/lib/state/minimumSqlite.test.ts
          for file in "${files[@]}"; do
            test -f "$file"
            run --preload ./src/lib/state/minimumSqlite.preload.ts "$file"
          done
          # Migration coverage is independent of the existing project-name
          # ambiguity failure in this file, which also fails on the base.
          run --preload ./src/lib/state/minimumSqlite.preload.ts src/lib/search/transcriptSearch.test.ts \
            --test-name-pattern 'migrates a version-one|upgrades version two|legacy migration captures|v4 to v5'

  scope:
    timeout-minutes: 3
    name: Scope (Windows)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # The merge commit and its first parent: the pull request's own change.
          fetch-depth: 2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Decide whether the pull request changes what the Windows leg runs
        id: scope
        run: >
          bun scripts/ci-platform-scope.ts
          --workflow .github/workflows/platform-tests.yml
          --prefix src/lib/proc/

  windows-platform:
    timeout-minutes: 10
    name: Windows (native)
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result != 'success' || needs.scope.outputs.run == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.3

      - name: Cache Bun install downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refuse to install where the package says it cannot run
        # The originating report: `"os": ["linux", "darwin"]` makes an install on
        # Windows fail with EBADPLATFORM before anything else can be tried. This
        # reads the field the resolver reads.
        run: |
          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          if ($manifest.os -notcontains 'win32') { throw "package.json still refuses win32: $($manifest.os -join ', ')" }
          Write-Output "package os field: $($manifest.os -join ', ')"

      - name: Prepare an isolated profile, state and temp root
        run: |
          foreach ($leaf in @('llv-home', 'llv-config', 'llv-state', 'llv-tmp')) {
            New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP $leaf) | Out-Null
          }

      # The Windows-only cases below skip themselves off win32, and a silent skip
      # would leave this job green having executed nothing. This step fails
      # instead when the runner is not Windows, when the backend selection is
      # wrong, or when any kernel reader the backend depends on returns nothing.
      - name: Require the live Windows kernel readers on this runner
        env:
          USERPROFILE: ${{ runner.temp }}\llv-home
          XDG_CONFIG_HOME: ${{ runner.temp }}\llv-config
          LLV_STATE_DIR: ${{ runner.temp }}\llv-state
          TMP: ${{ runner.temp }}\llv-tmp
          TEMP: ${{ runner.temp }}\llv-tmp
        run: bun scripts/verify-platform-backend.ts --expect win32

      - name: Platform tests
        env:
          USERPROFILE: ${{ runner.temp }}\llv-home
          XDG_CONFIG_HOME: ${{ runner.temp }}\llv-config
          LLV_STATE_DIR: ${{ runner.temp }}\llv-state
          TMP: ${{ runner.temp }}\llv-tmp
          TEMP: ${{ runner.temp }}\llv-tmp
        run: >
          bun test
          src/lib/proc/memory.test.ts
          src/lib/proc/portable.test.ts
          src/lib/proc/darwinIdentity.test.ts
          src/lib/proc/index.test.ts
          src/lib/proc/windowsSnapshot.test.ts
          src/lib/proc/windowsIdentity.test.ts
          src/lib/proc/windowsCwd.test.ts
          src/lib/proc/windows.test.ts
          src/lib/processGroup.test.ts
          src/lib/platformHome.test.ts
          src/lib/runtime/localEndpoint.test.ts
          src/lib/scanner/describe.test.ts
          src/lib/state/durableJson.test.ts
          src/runtime-host/socket.test.ts
          src/runtime-host/runtimeHostFence.test.ts
          bin/server-runtime.test.ts
          bin/bind-guard.test.ts

      - name: Install the launcher trial runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - name: Terminal bootstrap custody with native Windows paths
        env:
          USERPROFILE: ${{ runner.temp }}\llv-home
          XDG_CONFIG_HOME: ${{ runner.temp }}\llv-config
          LLV_STATE_DIR: ${{ runner.temp }}\llv-state
          TMP: ${{ runner.temp }}\llv-tmp
          TEMP: ${{ runner.temp }}\llv-tmp
        run: >
          bun test
          bin/launcher-relaunch.test.ts
          bin/launcher-credentials.test.ts
          src/lib/selfUpdate/pid.test.ts

      # The real launch also executes src/lib/transcriptSearchQuery.worker.ts;
      # keep that spawned entry visible to ci-platform-scope's dependency walk.
      - name: Transcript query worker lifecycle on the native kernel
        shell: bash
        env:
          HOME: ${{ runner.temp }}/llv-home
          USERPROFILE: ${{ runner.temp }}\llv-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/llv-config
          LLV_STATE_DIR: ${{ runner.temp }}/llv-state
          TMPDIR: ${{ runner.temp }}/llv-tmp
          TMP: ${{ runner.temp }}\llv-tmp
          TEMP: ${{ runner.temp }}\llv-tmp
          LLV_VIEWER_CONTROL_URL: http://127.0.0.1:1
          LLV_HELPER_LEASE_ENTRY: bin/helper-lease.mjs
        run: |
          bash scripts/gate-slot.sh bun test src/lib/search/transcriptSearchWorker.test.ts
          bash scripts/gate-slot.sh bun test bin/helper-lease-windows.test.ts

<title>Activity v2: desktop mockup (docs/design/activity-dashboard-v2.md)</title>
<!--
  A static mockup of the /activity desktop redesign. Nothing here is product
  code: the data below is invented, shaped like GET /api/activity plus the
  fields docs/design/activity-dashboard-v2.md proposes (days[].hours,
  days[].projects, unattendedUnreadMs).

  URL parameters pick the state that is drawn:
    lang   = en | uk
    range  = today | 7d | 30d
    state  = default | drawer | expand | expand-more | hover | hover-agents
             | hover-cell | empty
    data   = gap: the stage host is unread today from 09:00 to 12:00
    day    = the day the hover tooltip opens on (2026-09-21 by default)
    theme  = light | dark
  Rendered with headless Chrome at 1440x900; see the doc for the command.
-->
<style>
/* The app's tokens (src/styles/tokens.css), copied by value. */
:root {
  color-scheme: light;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --surface-canvas: #f4f1ec;
  --surface-card: #fffdfa;
  --surface-sunken: #f8f5f0;
  --surface-raised: #fffdfa;
  --shadow-1: 0 1px 2px rgb(20 20 30 / 0.05);
  --shadow-2: 0 8px 32px rgb(20 20 30 / 0.16), 0 1px 2px rgb(20 20 30 / 0.06);
  --color-primary: #1c1c22;
  --color-secondary: #55555f;
  --color-muted: #6c6c79;
  --border-default: #e5dfd5;
  --border-strong: #cbc3b7;
  --color-accent: #5a51e0;
  --color-accent-soft: #ecebfb;
  --color-success: #177a37;
  --color-warning: #8a5f00;
  --color-warning-soft: #fff4dd;
  --color-info: #0d9488;

  /* Chart marks. You = the accent, agents = the info teal (as in the
     prototype); each has one lighter step, validated as an ordinal pair.
     Texture means one thing on this page: your input was not read. */
  --mark-you: var(--color-accent);
  --mark-you-half: #9ca2f0;
  --mark-supervised: var(--color-info);
  --mark-unattended: #79b9ae;
  --mark-track: #f1ede6;
  --mark-hatch: var(--border-strong);
  --mark-stripe: rgb(255 253 250 / 0.78);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-canvas: #111218;
  --surface-card: #191b23;
  --surface-sunken: #14151b;
  --surface-raised: #20232c;
  --shadow-1: 0 1px 2px rgb(0 0 0 / 0.4);
  --shadow-2: 0 8px 32px rgb(0 0 0 / 0.55), 0 1px 2px rgb(0 0 0 / 0.4);
  --color-primary: #e8e8ec;
  --color-secondary: #a2a2ae;
  --color-muted: #8b8b98;
  --border-default: #292c36;
  --border-strong: #3c404c;
  --color-accent: #8f88ff;
  --color-accent-soft: #262347;
  --color-success: #4fc36f;
  --color-warning: #e0ae45;
  --color-warning-soft: #2b2312;
  --color-info: #2dd4bf;
  /* The dark chart steps sit inside the dark lightness band; the app's own
     accent and info tokens are brighter than it (validator, see the doc). */
  --mark-you: #7f79e6;
  --mark-you-half: #4a4786;
  --mark-supervised: #20a896;
  --mark-unattended: #296b65;
  --mark-track: #1f222b;
  --mark-hatch: #3c404c;
  --mark-stripe: rgb(25 27 35 / 0.8);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--surface-canvas);
  color: var(--color-primary);
  font-family: var(--font-sans);
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tab { font-variant-numeric: tabular-nums; }

.page { position: relative; max-width: 1328px; margin: 0 auto; padding: 20px 24px 16px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; height: 36px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--color-secondary); }
.btn.outline { border: 1px solid var(--border-default); background: var(--surface-card); color: var(--color-primary); }
.btn:hover { color: var(--color-primary); }
.title { display: flex; align-items: baseline; gap: 10px; margin-left: 4px; }
.title h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.title .when { font-size: 13px; color: var(--color-muted); }
.spacer { flex: 1; }
.seg { display: flex; padding: 2px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--surface-card); }
.seg button { height: 28px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--color-muted); }
.seg button[aria-pressed="true"] { background: var(--surface-canvas); color: var(--color-primary); }
.trust { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid var(--border-default); background: var(--surface-card); color: var(--color-secondary); }
.trust.warn { color: var(--color-warning); border-color: color-mix(in oklab, var(--color-warning) 30%, var(--border-default)); background: var(--color-warning-soft); }
.trust.ok svg { color: var(--color-success); }

/* Grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; margin-top: 18px; align-items: start; }
.card { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 12px; box-shadow: var(--shadow-1); }
.main { grid-column: 1; grid-row: 1; padding: 20px 22px 14px; }
.rhythm { grid-column: 1; grid-row: 2; padding: 14px 22px 12px; }
.projects { grid-column: 2; grid-row: 1 / span 2; align-self: stretch; position: relative; min-height: 200px; }
.projects .inner { position: absolute; inset: 14px 0 0; overflow: hidden; }
.grid.no-rhythm .projects { grid-row: 1; }

/* Figures */
.figures { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 24px; }
.fig-label { display: flex; align-items: center; gap: 7px; height: 14px; font-size: 12px; font-weight: 600; color: var(--color-secondary); }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; display: inline-block; }
.sw.you { background: var(--mark-you); }
.sw.you-half { background: var(--mark-you-half); }
.sw.sup { background: var(--mark-supervised); }
.sw.una { background: var(--mark-unattended); }
.sw.hatch { background: repeating-linear-gradient(45deg, var(--mark-hatch) 0 1.2px, transparent 1.2px 3.5px), var(--mark-track); }
.unr { background: repeating-linear-gradient(45deg, var(--mark-stripe) 0 1.3px, transparent 1.3px 3.6px), var(--mark-unattended); }
.fig-value { margin-top: 6px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.fig-value .v { font-size: 44px; line-height: 1; font-weight: 650; letter-spacing: -0.02em; }
.fig-value .v.agents { font-size: 32px; }
.fig-value .v .q { font-size: 0.62em; font-weight: 500; color: var(--color-muted); margin-right: 6px; vertical-align: 0.18em; }
.fig-value .v.unknown { font-size: 32px; color: var(--color-secondary); }
.fig-value .unit { font-size: 13px; color: var(--color-muted); font-weight: 500; }
.fig-sub { margin-top: 8px; font-size: 12px; color: var(--color-muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.fig-sub .k { color: var(--color-secondary); font-weight: 600; }
.fig-sub .item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.link { color: var(--color-accent); font-weight: 600; }
.meter { display: flex; gap: 2px; height: 8px; margin-top: 12px; max-width: 360px; }
.meter span { height: 100%; }
.meter span:first-child { border-radius: 3px 0 0 3px; }
.meter span:last-child { border-radius: 0 3px 3px 0; }
.meter span:only-child { border-radius: 3px; }

.chart-wrap { position: relative; margin-top: 18px; border-top: 1px solid var(--border-default); padding-top: 12px; }
.chart-wrap svg text { font-family: var(--font-sans); }

/* Rhythm */
.sec-head { display: flex; align-items: center; gap: 12px; height: 22px; }
.sec-head h2 { margin: 0; font-size: 13px; font-weight: 650; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--color-muted); }
.legend .item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

/* Projects */
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px; gap: 8px; align-items: center; padding: 0 18px 8px; }
.p-head h2 { margin: 0; font-size: 13px; font-weight: 650; display: flex; gap: 8px; align-items: baseline; }
.p-head h2 .n { font-weight: 500; color: var(--color-muted); font-size: 12px; }
.p-head .col { font-size: 11px; font-weight: 600; color: var(--color-muted); text-align: right; display: inline-flex; justify-content: flex-end; align-items: center; gap: 2px; }
.p-head .col.on { color: var(--color-primary); }
.p-head .col svg { width: 12px; height: 12px; }
.p-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 92px; gap: 8px; align-items: center; padding: 8px 18px 9px; border-top: 1px solid var(--border-default); width: 100%; text-align: left; }
.p-row:hover, .p-row.open { background: var(--surface-sunken); }
.p-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.p-name .nm { font-size: 13px; font-weight: 600; color: var(--color-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 10px; font-weight: 600; color: var(--color-secondary); border: 1px solid var(--border-default); border-radius: 999px; padding: 0 6px; line-height: 16px; white-space: nowrap; }
.p-bar { margin-top: 6px; height: 4px; border-radius: 0 2px 2px 0; background: var(--mark-you); }
.p-bar.zero { background: none; }
.p-you { text-align: right; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.p-ag { text-align: right; font-size: 12px; color: var(--color-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.q { color: var(--color-muted); font-weight: 500; }
.p-more { color: var(--color-secondary); }
.p-more .nm { font-weight: 500; color: var(--color-secondary); }
.p-detail { padding: 2px 18px 12px; background: var(--surface-sunken); font-size: 12px; line-height: 1.45; color: var(--color-muted); display: grid; gap: 5px; }
.p-detail .line { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.p-detail .line b { color: var(--color-secondary); font-weight: 600; }
.p-detail .v { color: var(--color-primary); font-variant-numeric: tabular-nums; }
.p-detail .nw { white-space: nowrap; }
.p-detail .toggle { display: inline-flex; align-items: center; gap: 4px; color: var(--color-accent); font-weight: 600; font-size: 12px; margin-top: 1px; }
.p-detail .toggle svg { width: 12px; height: 12px; }
.p-detail .more { display: grid; gap: 5px; padding-top: 7px; border-top: 1px solid var(--border-default); }
.p-detail .more .note { font-size: 11px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--color-secondary); }

/* Tooltip */
.tip { position: absolute; z-index: 5; width: max-content; max-width: 300px; background: var(--surface-raised); border: 1px solid var(--border-default); border-radius: 8px; box-shadow: var(--shadow-2); padding: 9px 11px; font-size: 12px; line-height: 1.45; }
.tip .d { font-weight: 650; margin-bottom: 4px; }
.tip .tg { display: grid; grid-template-columns: 10px max-content 1fr; column-gap: 8px; row-gap: 1px; align-items: center; }
.tip .tg .val { text-align: right; font-weight: 600; color: var(--color-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip .tg .lab { color: var(--color-secondary); white-space: nowrap; }
.tip .tg .gap { grid-column: 1 / -1; height: 5px; }
.tip .tg.nosw { grid-template-columns: max-content 1fr; }
.tip .tk { display: grid; grid-template-columns: max-content 1fr; column-gap: 10px; row-gap: 1px; }
.tip .tk .lab { color: var(--color-muted); }
.tip .tk .val { color: var(--color-primary); }
.tip .note { margin-top: 5px; color: var(--color-muted); font-size: 11px; }
.tip .note span { white-space: nowrap; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgb(28 28 34 / 0.18); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 460px; background: var(--surface-raised); border-left: 1px solid var(--border-default); box-shadow: var(--shadow-2); padding: 18px 22px; overflow: auto; font-size: 12.5px; line-height: 1.5; color: var(--color-secondary); }
.drawer .dh { display: flex; align-items: center; justify-content: space-between; }
.drawer h2 { margin: 0; font-size: 15px; font-weight: 650; color: var(--color-primary); }
.drawer h3 { margin: 18px 0 8px; font-size: 11px; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-muted); }
.drawer ul { margin: 0; padding-left: 16px; display: grid; gap: 6px; }
.drawer .flag { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--color-warning-soft); color: var(--color-primary); margin-bottom: 6px; }
.drawer .flag svg { color: var(--color-warning); margin-top: 2px; }
.drawer .nums { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 2px; padding: 6px 0 8px; }
.drawer .nums b { color: var(--color-primary); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.drawer .host { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--border-default); }
.drawer .host .hn { color: var(--color-primary); font-weight: 600; }
.drawer .host .ok { color: var(--color-success); }
.drawer .host .no { color: var(--color-warning); }
.drawer details { border-top: 1px solid var(--border-default); padding: 10px 0 0; margin-top: 12px; }
.drawer summary { color: var(--color-primary); font-weight: 600; font-size: 12.5px; }
.drawer .foot { margin-top: 16px; font-size: 11.5px; color: var(--color-muted); }
</style>
</head>

const WD = { en: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], uk: ["нд", "пн", "вт", "ср", "чт", "пт", "сб"] };
const WDL = { en: ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"], uk: ["неділя", "понеділок", "вівторок", "середа", "четвер", "пʼятниця", "субота"] };
const MON = { en: ["Jan", "Feb", "Mar", "Apr", "May", "June", "July", "Aug", "Sept", "Oct", "Nov", "Dec"], uk: ["січ.", "лют.", "бер.", "квіт.", "трав.", "черв.", "лип.", "серп.", "вер.", "жовт.", "лист.", "груд."] };
const num = (v) => LANG === "uk" ? String(v).replace(".", ",") : String(v);

const MIN = LANG === "uk" ? "хв" : "m";
function dur(min) {
  min = Math.round(min);
  const h = Math.floor(min / 60), m = min % 60;
  if (!h) return `${m} ${MIN}`;
  if (!m) return `${h} ${C.hoursUnit}`;
  return `${h} ${C.hoursUnit} ${m} ${MIN}`;
}
/* Agent time is an estimate, so it is never shown to the minute: whole hours
   from 10 h, five-minute steps below, and a dash for none. */
function adur(min) {
  if (min < 2.5) return "–";
  if (min >= 600) return `${Math.round(min / 60)} ${C.hoursUnit}`;
  return dur(Math.round(min / 5) * 5);

const ax = (min) => min < 2.5 ? "–" : `≈ ${adur(min)}`;
/* Agent-hours are a count of hours: half-hour steps below 10, whole above. */
const ah = (min) => `≈ ${num(min >= 600 ? Math.round(min / 60) : Math.round(min / 30) / 2)}`;
/* A split is rounded so its parts add up to the total shown beside it
   (largest remainder, in the total's own step). */
function partsRound(total, parts) {
  const unit = total >= 600 ? 60 : 5;
  const T = Math.round(total / unit);
  const raw = parts.map((p) => p / unit);
  const out = raw.map(Math.floor);
  let rem = T - out.reduce((a, b) => a + b, 0);
  const order = raw.map((r, i) => [r - out[i], i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; rem > 0 && k < order.length; k++, rem--) out[order[k][1]]++;
  for (let k = order.length - 1; rem < 0 && k >= 0; k--) if (out[order[k][1]] > 0) { out[order[k][1]]--; rem++; }
  return out.map((v) => v * unit);
}
const approx = (min) => min < 2.5 ? `<span class="q">–</span>` : `<span class="q">≈</span> ${adur(min)}`;
const dayShort = (d) => `${WD[LANG][d.getUTCDay()]} ${d.getUTCDate()}`;
const dayLong = (d) => LANG === "uk" ? `${WD.uk[d.getUTCDay()]}, ${d.getUTCDate()} ${MON.uk[d.getUTCMonth()]}` : `${WD.en[d.getUTCDay()]} ${d.getUTCDate()} ${MON.en[d.getUTCMonth()]}`;

const sum = (o) => Object.values(o).reduce((s, v) => s + v, 0);

const STAGE = new Set(["orchard-client", "harbor-ledger"]);
const NOW_HOUR = 14 + 10 / 60; // Thu 24 Sept, 14:10
const TODAY = "2026-09-24";
const GAP_SPAN = [9, 12];      // data=gap: the stage host unread today 09:00-12:00

/* The last seven days, by hand: your input blocks [from, to, project,

const WEEK = {

/* The 23 days before them, generated from a fixed seed. */
function rng(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }
function generatedDay(date, r) {
  const wd = new Date(date + "T00:00:00Z").getUTCDay();
  const weights = [["orchard-client", 5], ["harbor-ledger", 4], ["lantern-api", 3], ["tidewater-app", 3], ["kestrel-cli", 2], ["atlas-docs", 1], ["mesa-infra", 1], ["cobalt-auth", 1], ["fennel-site", 1]];
  const pick = () => { let t = r() * weights.reduce((s, w) => s + w[1], 0); for (const [p, w] of weights) { if ((t -= w) < 0) return p; } return weights[0][0]; };
  const you = [], agents = [];
  if (date === "2026-09-04") return { you, agents }; // a day off: every host read, nothing happened
  if (wd >= 1 && wd <= 5) {
    const a = 8.5 + r() * 1.5, b = a + 2 + r() * 2;
    const p1 = pick(); you.push([a, b, p1, 0.8 + r() * 0.15]); agents.push([a + 0.2, b + 0.6, 0.85, p1]);
    const c = 13 + r() * 1.5, d = c + 1.5 + r() * 2.5;
    const p2 = pick(); you.push([c, d, p2, 0.8 + r() * 0.15]); agents.push([c + 0.1, d + 1.2 * r(), 0.85, p2]);
    if (r() < 0.45) { const e = 19.5 + r() * 1.5; const p3 = pick(); you.push([e, e + 1 + r() * 1.5, p3, 0.75]); }
  } else if (r() < 0.35) {
    const e = 11 + r() * 4; const p = pick(); you.push([e, e + 0.6 + r(), p, 0.7]);
  }
  if (r() < 0.55) { const n = 0.5 + r() * 3; agents.push([n, n + 1 + r() * 2.5, 0.85, pick()]); }
  return { you, agents };
}

function scaleTo(obj, cap) { const t = sum(obj); if (t > cap) for (const k in obj) obj[k] *= cap / t; }

/* Hours of one day: your minutes per clock hour by project, the hour's
   report weight and owner, and agent minutes split three ways: supervised
   (inside your read time on the same project), unattended (outside it, with
   every host read) and unclear (outside it, where your input was not read).
   This is what the proposed days[].hours field carries; the server computes
   it with the method, the page never does. */
function buildDay(date, spec) {
  const isToday = date === TODAY;
  const hours = [];
  for (let h = 0; h < 24; h++) {
    const future = isToday && h >= Math.ceil(NOW_HOUR);
    const gapHour = GAP && isToday && h >= GAP_SPAN[0] && h < GAP_SPAN[1];
    const unknown = !future && (EMPTY || !!spec.unread || gapHour);
    const youBy = {};
    if (!EMPTY) for (const [a, b, p, dens] of spec.you) {
      const o = Math.max(0, Math.min(b, h + 1) - Math.max(a, h));
      if (o <= 0) continue;
      if (gapHour && STAGE.has(p)) continue; // typed on the stage host, which was not read
      youBy[p] = (youBy[p] || 0) + o * 60 * dens;
    }
    scaleTo(youBy, 60);
    const agentBy = {};
    for (const [a, b, dens, p] of spec.agents) {
      const o = Math.max(0, Math.min(b, h + 1) - Math.max(a, h));
      if (o > 0) agentBy[p] = (agentBy[p] || 0) + o * 60 * dens;
    }
    scaleTo(agentBy, 60);
    const supBy = {}, unaBy = {}, unrBy = {};
    for (const [p, m] of Object.entries(agentBy)) {
      const s = Math.min(m, youBy[p] || 0);
      supBy[p] = s;
      (unknown ? unrBy : unaBy)[p] = m - s;
    }
    const humanMin = sum(youBy);
    const weight = humanMin >= 40 ? 1 : humanMin >= 10 ? 0.5 : 0;
    const owner = Object.entries(youBy).sort((x, y) => y[1] - x[1])[0]?.[0] ?? null;
    hours.push({ hour: h, future, unknown, humanMin, weight, owner, youBy, agentMin: sum(agentBy), agentBy, supBy, unaBy, unrBy });
  }
  const wd = new Date(date + "T00:00:00Z").getUTCDay();
  const workday = wd >= 1 && wd <= 5;
  const complete = !EMPTY && !spec.unread && !(GAP && isToday);
  const humanMin = hours.reduce((s, x) => s + x.humanMin, 0);
  const wall = hours.reduce((s, x) => s + x.agentMin, 0);
  const missingSource = !EMPTY && workday && humanMin === 0 && (!complete || wall >= 30);
  /* A flagged day: your input for it is not trusted at all, so none of its
     agent time can be called unattended. */
  if (missingSource) for (const x of hours) if (!x.future) {
    x.unknown = true;
    for (const p in x.unaBy) { x.unrBy[p] = (x.unrBy[p] || 0) + x.unaBy[p]; x.unaBy[p] = 0; }
  }
  for (const x of hours) { x.supMin = sum(x.supBy); x.unaMin = sum(x.unaBy); x.unrMin = sum(x.unrBy); }
  return {
    date, d: new Date(date + "T00:00:00Z"), hours, workday, complete, missingSource, today: isToday,
    humanHours: hours.reduce((s, x) => s + x.weight, 0), humanMin,
    supMin: hours.reduce((s, x) => s + x.supMin, 0),
    unaMin: hours.reduce((s, x) => s + x.unaMin, 0),
    unrMin: hours.reduce((s, x) => s + x.unrMin, 0),
    wallMin: wall,
  };
}

function dates(n) {
  const out = []; const end = new Date(TODAY + "T00:00:00Z");
  for (let i = n - 1; i >= 0; i--) { const d = new Date(end); d.setUTCDate(d.getUTCDate() - i); out.push(d.toISOString().slice(0, 10)); }
  return out;
}

/* Invented per-project detail with the shapes of the response's bySurface,
   byKind, byHost, byEngine, byRole and pipelines; every list adds up to the
   figure it shares out. */
function projectDetail(p) {
  const h = [...p.name].reduce((s, c) => s + c.charCodeAt(0), 0);
  const agentHours = p.agents * (1.3 + (h % 5) / 10);
  const stageShare = STAGE.has(p.name) ? 0.86 : 0;
  return {
    agentHours,
    conversations: 3 + (h % 6),
    reassigned: p.youMin > 120 ? 12 : 0,
    hosts: [["Stage host", p.youMin * stageShare, p.lowerBound], ["Workstation", p.youMin * (1 - stageShare), false]].filter((x) => x[1] >= 1).sort((a, b) => b[1] - a[1]),
    surface: [["desktop", 0.62], ["phone", 0.24], ["terminal", 0.14]].map(([k, s]) => [C.surface[k], p.youMin * s]),
    kind: [["message", 0.71], ["answer", 0.15], ["voice", 0.1], ["decision", 0.04]].map(([k, s]) => [C.kind[k], p.youMin * s]),
    engine: [["Claude", 0.63], ["Codex", 0.37]].map(([k, s]) => [k, agentHours * s]),
    role: [["implementer", 0.47], ["reviewer", 0.29], ["architect", 0.12], [C.roleUnregistered, 0.12]].map(([k, s]) => [k, agentHours * s]),
    pipelines: [["7c1e04ab", "design · build", 0.44], ["2f9a61d0", "review", 0.21]].map(([id, st, s]) => [id, st, agentHours * s]),
  };
}

function buildReport(range) {
  const r = rng(20260924);
  const all = dates(30).map((date) => [date, WEEK[date] || generatedDay(date, r)]);
  const n = range === "today" ? 1 : range === "7d" ? 7 : 30;
  const days = all.slice(-n).map(([date, spec]) => buildDay(date, spec));
  const unreadDays = days.filter((d) => !d.complete);
  const projects = {};
  const row = (p) => (projects[p] ||= { you: 0, youMin: 0, sup: 0, una: 0, unr: 0, inputs: 0 });
  for (const day of days) for (const x of day.hours) {
    if (x.weight && x.owner) row(x.owner).you += x.weight;
    for (const [p, m] of Object.entries(x.youBy)) { row(p).youMin += m; row(p).inputs += Math.round(m / 7); }
    for (const p of Object.keys(x.agentBy)) { const o = row(p); o.sup += x.supBy[p] || 0; o.una += x.unaBy[p] || 0; o.unr += x.unrBy[p] || 0; }
  }
  const rows = Object.entries(projects).map(([name, v]) => {
    const p = { name, ...v, billable: BILLABLE.has(name), agents: v.sup + v.una + v.unr, unknown: EMPTY, lowerBound: !EMPTY && STAGE.has(name) && unreadDays.length > 0 };
    p.detail = projectDetail(p);
    return p;
  }).sort((a, b) => EMPTY ? b.agents - a.agents : b.you - a.you || b.agents - a.agents);
  const totals = {
    humanHours: days.reduce((s, d) => s + d.humanHours, 0),
    humanMin: days.reduce((s, d) => s + d.humanMin, 0),
    billable: rows.filter((x) => x.billable).reduce((s, x) => s + x.you, 0),
    supMin: days.reduce((s, d) => s + d.supMin, 0),
    unaMin: days.reduce((s, d) => s + d.unaMin, 0),
    unrMin: days.reduce((s, d) => s + d.unrMin, 0),
    wallMin: days.reduce((s, d) => s + d.wallMin, 0),
  };
  totals.agentHoursMin = rows.reduce((s, p) => s + p.detail.agentHours, 0);
  return { range, days, projects: rows, totals, unreadDays, missingDays: days.filter((d) => d.missingSource) };
}

const R = buildReport(RANGE);
const LOWER = !EMPTY && R.unreadDays.length > 0;

/* When the unread stretch was, in words: "on 22–23 Sept" or "today, 09:00–12:00". */
function unreadWhen() {
  const u = R.unreadDays;
  if (!u.length) return "";
  if (u.length === 1 && u[0].today) return fmt(C.todaySpan, { span: `${hh(GAP_SPAN[0])}–${hh(GAP_SPAN[1])}` });
  const days = u.length === 1 ? dayMonth(u[0].d) : `${u[0].d.getUTCDate()}–${dayMonth(u.at(-1).d)}`;
  return fmt(C.onDays, { days });
}

function figures() {
  const t = R.totals;
  const q = LOWER ? `<span class="q">≥</span>` : "";
  const ge = LOWER ? "≥ " : "";
  const you = EMPTY
    ? `<div class="fig-value"><span class="v unknown">${C.unknown}</span></div>
       <div class="fig-sub"><span>${C.noneRead}</span><span class="link item">${icon("plug")}${C.connect}</span></div>`
    : `<div class="fig-value"><span class="v">${q}${hrs(t.humanHours)}</span><span class="unit">${C.reported}</span></div>
       <div class="fig-sub"><span>${fmt(C.byMinute, { v: ge + dur(t.humanMin) })}</span><span>·</span><span class="k">${fmt(C.billable, { v: ge + hrs(t.billable) })}</span></div>`;
  const [s, u, n] = partsRound(t.wallMin, [t.supMin, t.unaMin, t.unrMin]);
  const parts = [[s, "sw sup", "background:var(--mark-supervised)", C.supervised], [u, "sw una", "background:var(--mark-unattended)", C.unattended], [n, "sw unr", "", C.unclear]].filter((x) => x[0] > 0);
  const meter = `<div class="meter" aria-hidden="true">${parts.map(([v, cls, style]) => `<span class="${cls.includes("unr") ? "unr" : ""}" style="flex:${v};${style}"></span>`).join("")}</div>`;
  const agentsSub = EMPTY
    ? `<div class="fig-sub" style="margin-top:7px"><span class="item"><span class="sw unr"></span>${C.splitUnknown}</span></div>`
    : `<div class="fig-sub" style="margin-top:7px">${parts.map(([v, cls, , label]) => `<span class="item"><span class="${cls}"></span>${fmt(label, { v: ax(v) })}</span>`).join("")}</div>`;
  return `<div class="figures">
    <div data-figure="you">
      <div class="fig-label"><span class="sw you"></span>${C.you}</div>
      ${you}
    </div>
    <div data-figure="agents">
      <div class="fig-label">${C.agents}</div>
      <div class="fig-value"><span class="v agents" id="agents-value"><span class="q">≈</span>${adur(t.wallMin)}</span></div>
      ${meter}
      ${agentsSub}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ */
/* The day chart: your reported hours beside agent time, per day       */
/* ------------------------------------------------------------------ */
function dayChart(width) {
  const today = RANGE === "today";
  const cols = today
    ? R.days[0].hours.map((x) => ({ key: x.hour, you: x.humanMin, sup: x.supMin, una: x.unaMin, unr: x.unrMin, future: x.future, unknown: x.unknown, day: R.days[0] }))
    : R.days.map((d) => ({ key: d.date, you: d.humanHours, sup: d.supMin / 60, una: d.unaMin / 60, unr: d.unrMin / 60, day: d }));
  const H = today ? 300 : RANGE === "30d" ? 176 : 228;
  const top = 20, axisW = today ? 50 : 40, bottom = 26;
  const plotW = width - axisW;
  const max = today ? 60 : Math.max(4, ...cols.map((c) => Math.max(c.you, c.sup + c.una + c.unr)));
  const step = today ? 30 : max > 10 ? 4 : 2;
  const yMax = today ? 60 : Math.ceil(max / step) * step;
  const y = (v) => top + H - (v / yMax) * H;
  const slot = plotW / cols.length;
  const bw = Math.min(22, Math.floor((slot - (RANGE === "30d" ? 6 : 10)) / 2));
  const gap = RANGE === "30d" ? 2 : 3;
  let s = `<svg width="${width}" height="${top + H + bottom}" viewBox="0 0 ${width} ${top + H + bottom}" role="img">`;
  for (let v = 0; v <= yMax; v += step) {
    const yy = Math.round(y(v)) + 0.5;
    s += `<line x1="${axisW}" x2="${width}" y1="${yy}" y2="${yy}" stroke="var(--border-default)" stroke-width="1"/>`;
    s += `<text x="${axisW - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--color-muted)" class="tab">${v}${v === yMax ? ` ${today ? C.minUnit : C.hoursUnit}` : ""}</text>`;
  }
  const rad = 3;
  const topRounded = (x, y0, y1, fill) => {
    const r = Math.min(rad, y0 - y1);
    return `<path d="M${x} ${y0} V${y1 + r} Q${x} ${y1} ${x + r} ${y1} H${x + bw - r} Q${x + bw} ${y1} ${x + bw} ${y1 + r} V${y0} Z" fill="${fill}"/>`;
  };
  /* A column of parts from the baseline up, a 2 px surface gap between parts,
     the top part rounded. Heights stay true to the values. */
  const stack = (x, parts) => {
    const drawn = parts.filter(([v]) => v > 0.004 * yMax);
    let acc = 0, out = "";
    drawn.forEach(([v, fill], i) => {
      const y0 = y(acc) - (i > 0 ? 1 : 0), y1 = y(acc + v) + (i < drawn.length - 1 ? 1 : 0);
      acc += v;
      if (y0 - y1 < 0.5) return;
      out += i === drawn.length - 1 ? topRounded(x, y0, y1, fill) : `<rect x="${x}" y="${y1}" width="${bw}" height="${y0 - y1}" fill="${fill}"/>`;
    });
    return out;
  };
  /* Today, a stretch a host did not read: one hatched band the full height
     of the plot behind those hours, labelled where it starts. Whatever was
     read is drawn over it; an empty slot inside it means "not read", never 0. */
  if (today) {
    const spans = [];
    cols.forEach((c, i) => { if (c.unknown && !c.future) { const last = spans.at(-1); if (last && last[1] === i) last[1] = i + 1; else spans.push([i, i + 1]); } });
    for (const [a, b] of spans) {
      const x0 = axisW + slot * a + 1, x1 = axisW + slot * b - 1;
      s += `<rect x="${x0}" y="${top}" width="${x1 - x0}" height="${H}" fill="url(#hatch)" opacity="0.75" data-unread="${a}-${b}"/>`;
      s += `<text x="${x0 + 2}" y="${top - 6}" font-size="11" font-weight="600" fill="var(--color-secondary)">${fmt(C.bandUnread, { host: "Stage host" })}</text>`;
    }
  }
  cols.forEach((c, i) => {
    const cx = axisW + slot * i + slot / 2;
    const xa = cx - bw - gap / 2, xb = cx + gap / 2;
    if (today && c.key % 3 === 0) s += `<text x="${axisW + slot * i}" y="${top + H + 17}" font-size="11" fill="var(--color-muted)" class="tab">${String(c.key).padStart(2, "0")}</text>`;
    if (c.future) return;
    if (c.you > 0) s += stack(xa, [[c.you, "var(--mark-you)"]]);
    s += stack(xb, [[c.sup, "var(--mark-supervised)"], [c.una, "var(--mark-unattended)"], [c.unr, "url(#hatch-unr)"]]);
    /* Your value on the cap: the figure the report uses. Only for days. */
    if (!today) {
      const d = c.day;
      const unread = EMPTY || d.missingSource || (!d.complete && c.you === 0);
      const label = unread ? "?" : c.you > 0 ? (d.complete ? "" : "≥ ") + num(c.you) : "0";
      const fill = d.missingSource ? "var(--color-warning)" : c.you > 0 ? "var(--color-primary)" : "var(--color-muted)";
      if (RANGE === "7d") s += `<text x="${xa + bw / 2}" y="${y(c.you) - 6}" text-anchor="middle" font-size="${label === "?" ? 14 : 12}" font-weight="${c.you > 0 || d.missingSource ? 650 : 500}" fill="${fill}" class="tab">${label}</text>`;
      else if (d.missingSource || (!d.complete && !EMPTY)) s += `<text x="${xa + bw / 2}" y="${y(c.you) - 5}" text-anchor="middle" font-size="10" font-weight="600" fill="${d.missingSource ? "var(--color-warning)" : "var(--color-muted)"}">${unread ? "?" : "≥"}</text>`;
      const weekend = !d.workday;
      let text = null;
      if (RANGE === "7d") text = d.today ? C.todayX : dayShort(d.d);
      else if (d.today) text = C.todayX;
      else if (d.d.getUTCDay() === 1 && (R.days.length - 1 - i) > 3) text = dayMonth(d.d);
      if (text) s += `<text x="${RANGE === "7d" ? cx : d.today ? cx + bw + gap : cx - bw}" y="${top + H + 18}" text-anchor="${RANGE === "7d" ? "middle" : d.today ? "end" : "start"}" font-size="${RANGE === "7d" ? 12 : 11}" font-weight="${d.today ? 650 : 500}" fill="${d.today ? "var(--color-primary)" : weekend ? "var(--color-muted)" : "var(--color-secondary)"}">${text}</text>`;
      if (RANGE === "30d" && !text) s += `<line x1="${cx}" x2="${cx}" y1="${top + H + 4}" y2="${top + H + 7}" stroke="var(--border-strong)"/>`;
    }
  });
  if (today) {
    const xNow = axisW + slot * NOW_HOUR;
    s += `<line x1="${xNow}" x2="${xNow}" y1="${top - 4}" y2="${top + H}" stroke="var(--color-muted)" stroke-width="1" opacity="0.6"/>`;
    s += `<text x="${axisW + slot * 24}" y="${top + H + 17}" text-anchor="end" font-size="11" fill="var(--color-muted)">24</text>`;
  }
  s += `</svg>`;
  return { svg: s, geometry: { axisW, slot, bw, gap, top, H, y } };
}

/* ------------------------------------------------------------------ */
/* Rhythm: a day x hour grid, one cell per clock hour                  */
/* ------------------------------------------------------------------ */
function rhythm(width) {
  const labelW = 60;
  const gridW = width - labelW;
  const cg = 2;
  const cw = (gridW - cg * 23) / 24;
  const dense = R.days.length > 7;
  const lane = dense ? 7 : 18, rowGap = dense ? 3 : 6;
  const height = R.days.length * (lane + rowGap) - rowGap + 24;
  let s = `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img">`;
  const cells = [];
  R.days.forEach((d, r) => {
    const y0 = r * (lane + rowGap);
    const showLabel = !dense || d.today || d.d.getUTCDay() === 1;
    if (showLabel) {
      const lbl = d.today ? C.todayX : dense ? dayMonth(d.d) : dayShort(d.d);
      s += `<text x="0" y="${y0 + lane / 2 + 4}" font-size="${dense ? 10.5 : 12}" font-weight="${d.today ? 650 : 500}" fill="${d.today ? "var(--color-primary)" : d.workday ? "var(--color-secondary)" : "var(--color-muted)"}">${lbl}</text>`;
    }
    d.hours.forEach((x, i) => {
      if (x.future) return;
      const cx = labelW + i * (cw + cg);
      /* One cell per clock hour: your weight wins; otherwise agents working
         without you (unclear where your input was not read); otherwise a
         hatch where a host was not read. */
      const alone = x.agentMin >= 10;
      const fill = x.weight === 1 ? "var(--mark-you)" : x.weight === 0.5 ? "var(--mark-you-half)"
        : alone ? (x.unknown ? "url(#hatch-unr)" : "var(--mark-unattended)")
        : x.unknown ? "url(#hatch)" : "var(--mark-track)";
      s += `<rect x="${cx}" y="${y0}" width="${cw}" height="${lane}" rx="${dense ? 1.5 : 3}" fill="${fill}"/>`;
      cells.push({ date: d.date, hour: x.hour, x: cx, y: y0, w: cw, h: lane });
    });
  });
  const ay = height - 6;
  for (const tick of [0, 6, 12, 18, 24]) {
    const tx = labelW + tick * (cw + cg) - (tick === 24 ? cg : 0);
    s += `<text x="${tx}" y="${ay}" text-anchor="${tick === 0 ? "start" : tick === 24 ? "end" : "middle"}" font-size="11" fill="var(--color-muted)" class="tab">${String(tick).padStart(2, "0")}</text>`;
  }
  s += `</svg>`;
  return { svg: s, cells };
}

/* ------------------------------------------------------------------ */
/* Projects                                                            */
/* ------------------------------------------------------------------ */
const OPEN_PROJECT = "harbor-ledger";
function projectsCard(budget) {
  const rows = R.projects;
  const fit = rows.length <= budget ? rows.length : budget - 1;
  const openName = STATE === "expand" || STATE === "expand-more" ? OPEN_PROJECT : null;
  let shown = rows.slice(0, fit), rest = rows.slice(fit);
  if (openName && !shown.some((p) => p.name === openName)) { shown = rows.slice(0, fit - 1).concat(rows.filter((p) => p.name === openName)); rest = rows.filter((p) => !shown.includes(p)); }
  const max = Math.max(...rows.map((p) => p.you), 0.5);
  const youCell = (p) => EMPTY || p.unknown || (p.lowerBound && !p.you) ? `<span class="q">?</span>` : p.you ? `${p.lowerBound ? '<span class="q">≥ </span>' : ""}${hrs(p.you)}` : `<span class="q">0</span>`;
  let html = `<div class="p-head"><h2>${C.projects}<span class="n">${rows.length}</span></h2>${EMPTY ? `<span class="col">${C.colYou}</span><span class="col on">${C.colAgents}${icon("down")}</span>` : `<span class="col on">${C.colYou}${icon("down")}</span><span class="col">${C.colAgents}</span>`}</div>`;
  for (const p of shown) {
    html += `<div class="p-row${p.name === openName ? " open" : ""}" role="button" aria-expanded="${p.name === openName}">
      <div style="min-width:0"><div class="p-name"><span class="nm">${p.name}</span>${p.billable ? `<span class="pill">${C.billTag}</span>` : ""}</div>
      <div class="p-bar${p.you ? "" : " zero"}" style="width:${(p.you / max) * 100}%"></div></div>
      <div class="p-you">${youCell(p)}</div>
      <div class="p-ag">${approx(p.agents)}</div>
    </div>`;
    if (p.name === openName) html += projectDetailHtml(p, STATE === "expand-more");
  }
  if (rest.length) {
    const you = rest.reduce((s, p) => s + p.you, 0), ag = rest.reduce((s, p) => s + p.agents, 0);
    html += `<div class="p-row p-more" role="button"><div class="p-name"><span class="nm">${fmt(C.more, { n: rest.length })}</span></div><div class="p-you">${EMPTY ? '<span class="q">?</span>' : you ? hrs(you) : '<span class="q">0</span>'}</div><div class="p-ag">${approx(ag)}</div></div>`;
  }
  return html;
}

function projectDetailHtml(p, moreOpen) {
  const D = p.detail;
  const ge = p.lowerBound ? "≥ " : "";
  const [s, u, n] = partsRound(p.agents, [p.sup, p.una, p.unr]);
  const agentParts = [[s, C.supervised], [u, C.unattended], [n, C.unclear]].filter(([v]) => v > 0)
    .map(([v, label]) => `<span class="nw">${fmt(label, { v: `<span class="v">≈ ${adur(v)}</span>` })}</span>`);
  const list = (items, f) => items.filter((x) => x[1] >= 2.5).map(f).join(" · ");
  /* A list that shares out agent-hours, rounded so it adds up to them. */
  const share = (items, total) => { const r = partsRound(total, items.map((x) => x[1])); return items.map(([k], i) => r[i] ? `<span class="nw">${k} <span class="v">≈ ${adur(r[i])}</span></span>` : "").filter(Boolean).join(" · "); };
  const lines = [
    [C.dYou, [`<span class="nw"><span class="v">${fmt(C.byMinute, { v: ge + dur(p.youMin) })}</span></span>`, `<span class="nw">${plural(C.inputs, p.inputs)}</span>`, ...(D.reassigned ? [fmt(C.reassigned, { v: dur(D.reassigned) })] : [])].join(" · ")],
    [C.dAgents, [...agentParts, `<span class="nw">${plural(C.agentsN, D.conversations)}</span>`, `<span class="nw">${fmt(C.agentHoursShort, { v: ah(D.agentHours) })}</span>`].join(" · ")],
    [C.hostsLine, D.hosts.map(([name, m, low]) => `<span class="nw">${name} <span class="v">${low ? "≥ " : ""}${dur(m)}</span></span>`).join(" · ")],
  ];
  let html = `<div class="p-detail" data-detail="${p.name}">${lines.map(([k, v]) => `<div class="line"><b>${k}</b><span>${v}</span></div>`).join("")}
    <div class="line"><b></b><button class="toggle" aria-expanded="${moreOpen}">${icon(moreOpen ? "down" : "right")}${C.moreDetail}</button></div>`;
  if (moreOpen) {
    const more = [
      [C.bSurface, list(D.surface, ([k, m]) => `<span class="nw">${k} <span class="v">${dur(m)}</span></span>`)],
      [C.bInput, list(D.kind, ([k, m]) => `<span class="nw">${k} <span class="v">${dur(m)}</span></span>`)],
      [C.bEngine, share(D.engine, D.agentHours)],
      [C.bRole, share(D.role, D.agentHours)],
      [C.bPipelines, D.pipelines.map(([id, st, m]) => `<span class="nw"><span class="mono">${id}</span> ${st} <span class="v">≈ ${adur(m)}</span></span>`).join(" · ")],
    ];
    html += `<div class="more">${more.map(([k, v]) => `<div class="line"><b>${k}</b><span>${v}</span></div>`).join("")}<div class="note">${C.bNote}</div></div>`;
  }
  return html + `</div>`;
}

    <div class="host"><span class="ok">${icon("check")}</span><div><span class="hn">Workstation</span> · ${C.thisHost}<br>${C.srcBoth} · ${fmt(C.hostRead, { when: LANG === "uk" ? "24 вер., 14:05" : "24 Sept, 14:05" })}</div></div>
    ${stageRow}
    <h3>${C.hMethod}</h3>
    <ul><li>${C.m1}</li><li>${C.m2}</li><li>${C.m3}</li><li>${C.m4}</li><li>${C.m5}</li></ul>
    <details><summary>${C.excluded}</summary><ul style="margin-top:8px"><li>${C.exclLine1}</li><li>${C.exclLine2}</li></ul></details>
    <details><summary>${C.surfaces}</summary><ul style="margin-top:8px"><li>${C.surf1}</li><li>${C.surf2}</li><li>${C.surf3}</li></ul></details>
    <div class="foot">${fmt(C.foot, { when: LANG === "uk" ? "24 вер., 13:41" : "24 Sept, 13:41", n: 13 })}</div>
  </aside>`;
}

/* ------------------------------------------------------------------ */
/* Tooltips                                                            */
/* ------------------------------------------------------------------ */
function dayTip(d) {
  const low = !d.complete && !EMPTY;
  const ge = low ? "≥ " : "";
  const [s, u, n] = partsRound(d.wallMin, [d.supMin, d.unaMin, d.unrMin]);
  const row = (sw, val, lab) => `<span class="${sw}"></span><span class="val">${val}</span><span class="lab">${lab}</span>`;
  let g = "";
  if (d.missingSource) g += row("sw hatch", "?", C.tReported);
  else g += row("sw you", ge + hrs(d.humanHours), C.tReported) + row("", ge + dur(d.humanMin), C.tByMinute);
  g += `<span class="gap"></span>` + row("", ax(d.wallMin), C.tAgents);
  if (s) g += row("sw sup", ax(s), C.tSup);
  if (u) g += row("sw una", ax(u), C.tUna);
  if (n) g += row("sw unr", ax(n), C.tUnr);
  const byProject = Object.entries(d.hours.reduce((m, x) => (x.weight && x.owner ? (m[x.owner] = (m[x.owner] || 0) + x.weight, m) : m), {})).sort((a, b) => b[1] - a[1]);
  const notes = [];
  if (byProject.length) notes.push(byProject.map(([p, v]) => `<span>${p} ${hrs(v)}</span>`).join(" · "));
  if (d.missingSource) notes.push(C.tipMissing);
  else if (low) notes.push(fmt(C.tipLow, { host: "Stage host" }));
  if (n && !d.missingSource) notes.push(C.tipUnclear);
  return `<div class="d">${dayLong(d.d)}</div><div class="tg">${g}</div>${notes.map((x) => `<div class="note">${x}</div>`).join("")}`;
}

function agentsTip() {
  const t = R.totals;
  const row = (val, lab) => `<span class="val">${val}</span><span class="lab">${lab}</span>`;
  return `<div class="tg nosw">${row(ax(t.wallMin), C.tWall)}${row(ah(t.agentHoursMin), C.tAgentHours)}</div>${t.unrMin >= 2.5 ? `<div class="note">${C.tipUnclear}</div>` : ""}`;
}

function cellTip(d, x) {
  const you = x.unknown && x.humanMin < 1
    ? fmt(C.cellNotRead, { host: "Stage host" })
    : x.humanMin >= 1 ? `${dur(x.humanMin)} · ${x.owner}` : C.cellNone;
  const topAgent = Object.entries(x.agentBy).sort((a, b) => b[1] - a[1])[0]?.[0];
  const parts = [[x.supMin, C.tSup], [x.unaMin, C.tUna], [x.unrMin, C.tUnr]].filter(([v]) => v >= 2.5);
  const agents = x.agentMin >= 2.5 ? `≈ ${adur(x.agentMin)}${parts.length === 1 ? ` ${parts[0][1]}` : ""} · ${topAgent}` : "–";
  return `<div class="d">${dayLong(d.d)}, ${hh(x.hour)}–${hh(x.hour + 1)}</div>
    <div class="tk"><span class="lab">${C.cellYou}</span><span class="val">${you}</span><span class="lab">${C.cellAgents}</span><span class="val">${agents}</span></div>`;
}

function placeTip(html, anchor, side) {
  const app = document.getElementById("app");
  const box = app.getBoundingClientRect();
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.innerHTML = html;
  app.appendChild(tip);
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let left, top;
  if (side === "right") {
    /* Beside the pair, flipped to its left when it would leave the card. */
    const card = document.querySelector("[data-card=main]").getBoundingClientRect();
    left = anchor.right + 12; top = anchor.top;
    if (left + w > card.right - 8) left = anchor.left - 12 - w;
    top = Math.max(card.top + 8, Math.min(top, card.bottom - 8 - h));
  } else if (side === "below") { left = anchor.left; top = anchor.bottom + 8; }
  else { left = anchor.left + anchor.width / 2 - w / 2; top = anchor.top - 8 - h; }
  tip.style.left = `${left - box.left}px`;
  tip.style.top = `${top - box.top}px`;
}

/* ------------------------------------------------------------------ */
/* Page                                                                */
/* ------------------------------------------------------------------ */
function render() {
  const app = document.getElementById("app");
  const showRhythm = RANGE !== "today";
  app.innerHTML = `${header()}
    <div class="grid${showRhythm ? "" : " no-rhythm"}">
      <section class="card main" data-card="main">${figures()}<div class="chart-wrap" id="chart"></div></section>
      ${showRhythm ? `<section class="card rhythm" data-card="rhythm"><div class="sec-head"><h2>${C.rhythm}</h2><div class="spacer"></div>
        <div class="legend">${EMPTY ? "" : `<span class="item"><span class="sw you"></span>${C.lFull}</span><span class="item"><span class="sw you-half"></span>${C.lHalf}</span><span class="item"><span class="sw una"></span>${C.lAlone}</span>`}<span class="item"><span class="sw unr"></span>${C.lUnclear}</span><span class="item"><span class="sw hatch"></span>${C.lUnread}</span></div></div>
        <div id="rhythm" style="margin-top:10px"></div></section>` : ""}
      <aside class="card projects" data-card="projects"><div class="inner" id="plist"></div></aside>
    </div>${STATE === "drawer" ? drawer() : ""}`;
  const chartEl = document.getElementById("chart");
  const chart = dayChart(chartEl.clientWidth);
  chartEl.innerHTML = chart.svg;
  let rh = null;
  if (showRhythm) { const el = document.getElementById("rhythm"); rh = rhythm(el.clientWidth); el.innerHTML = rh.svg; }
  /* Rows fill the projects column; what does not fit folds into "+ N more". */
  const plist = document.getElementById("plist");
  let budget = R.projects.length;
  plist.innerHTML = projectsCard(budget);
  while (budget > 3 && plist.scrollHeight > plist.clientHeight) plist.innerHTML = projectsCard(--budget);

  if (STATE === "hover" && RANGE !== "today") {
    const i = R.days.findIndex((d) => d.date === HOVER_DAY);
    const g = chart.geometry, cr = chartEl.querySelector("svg").getBoundingClientRect();
    const cx = cr.left + g.axisW + g.slot * i + g.slot / 2;
    const d = R.days[i];
    const topY = cr.top + g.y(Math.max(d.humanHours, (d.wallMin) / 60));
    placeTip(dayTip(d), { left: cx - g.bw - 4, right: cx + g.bw + 4, top: Math.min(topY, cr.top + g.top + g.H - 150), bottom: 0, width: 0 }, "right");
  }
  if (STATE === "hover-agents") placeTip(agentsTip(), document.querySelector("[data-figure=agents]").getBoundingClientRect(), "below");
  if (STATE === "hover-cell" && rh) {
    const cell = rh.cells.find((c) => c.date === "2026-09-23" && c.hour === 18);
    const sr = document.querySelector("#rhythm svg").getBoundingClientRect();
    const d = R.days.find((x) => x.date === cell.date);
    placeTip(cellTip(d, d.hours[cell.hour]), { left: sr.left + cell.x, top: sr.top + cell.y, width: cell.w, right: 0, bottom: 0 }, "above");
  }
  measure();
}

/* Self-check, read back through --dump-dom: overflow, overlap and the
   agreement between the day chart and the rhythm. */
function measure() {
  const out = { viewport: [innerWidth, innerHeight], docHeight: document.documentElement.scrollHeight, scrollWidth: document.documentElement.scrollWidth, overflow: [] };
  for (const el of document.querySelectorAll(".nm, .fig-value, .fig-sub, .p-you, .p-ag, .trust, .btn, .seg button, .legend .item")) {
    if (el.scrollWidth > el.clientWidth + 1 && getComputedStyle(el).overflow !== "visible") out.overflow.push(el.className + ":" + el.textContent.trim().slice(0, 40));
  }
  for (const el of document.querySelectorAll(".tip")) {
    const r = el.getBoundingClientRect();
    if (r.left < 0 || r.right > innerWidth || r.top < 0 || r.bottom > innerHeight) out.overflow.push("tip outside the viewport");
  }
  out.cards = [...document.querySelectorAll("[data-card]")].map((c) => { const r = c.getBoundingClientRect(); return [c.dataset.card, Math.round(r.top), Math.round(r.bottom), Math.round(r.left), Math.round(r.right)]; });
  out.words = document.getElementById("app").innerText.split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length;
  /* Per day: agent minutes drawn solid-unattended inside an hour the rhythm
     hatches must be zero, and a flagged day draws no solid unattended. */
  out.days = R.days.map((d) => ({ date: d.date, you: d.humanHours, sup: Math.round(d.supMin), una: Math.round(d.unaMin), unr: Math.round(d.unrMin),
    unattendedInUnreadHours: Math.round(d.hours.filter((x) => x.unknown).reduce((s, x) => s + x.unaMin, 0)), missing: d.missingSource, complete: d.complete }));
  out.totals = Object.fromEntries(Object.entries(R.totals).map(([k, v]) => [k, Math.round(v * 10) / 10]));
  document.body.dataset.measure = JSON.stringify(out);
}
render();
</script>
